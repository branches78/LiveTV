// Compile-only declarations of @SystemApi classes that the public SDK does not contain.
// Never packaged: at runtime the device's framework provides the real classes.
plugins {
    id 'java-library'
}

java {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
}

sourceSets.main.java.srcDirs = ['src']

def localProperties = new Properties()
rootProject.file('local.properties').withInputStream { localProperties.load(it) }
def sdkDir = localProperties.getProperty('sdk.dir')

dependencies {
    compileOnly files("${sdkDir}/platforms/android-36/android.jar")
}
