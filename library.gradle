// Shared Android library configuration for the LiveTV Gradle modules.
android {
    compileSdk 36

    defaultConfig {
        minSdk 23
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    rootProject.ext.androidx.each { implementation it }
    compileOnly project(':systemstubs')
    implementation "com.google.dagger:dagger:${rootProject.ext.versions.dagger}"
    implementation "com.google.dagger:dagger-android:${rootProject.ext.versions.dagger}"
    implementation 'com.google.guava:guava:28.0-android'
    implementation "com.google.protobuf:protobuf-javalite:${rootProject.ext.versions.protobuf}"

    compileOnly 'com.google.auto.value:auto-value:1.5.3'
    compileOnly 'com.google.auto.factory:auto-factory:1.0-beta6'
    compileOnly 'com.google.errorprone:error_prone_annotations:2.3.2'
    compileOnly 'javax.annotation:javax.annotation-api:1.2'
    // Some sources still use the pre-AndroidX annotations.
    implementation 'com.android.support:support-annotations:28.0.0'

    annotationProcessor 'com.google.auto.value:auto-value:1.5.3'
    annotationProcessor 'com.google.auto.factory:auto-factory:1.0-beta6'
    annotationProcessor "com.google.dagger:dagger-compiler:${rootProject.ext.versions.dagger}"
    annotationProcessor "com.google.dagger:dagger-android-processor:${rootProject.ext.versions.dagger}"
}
