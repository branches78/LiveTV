plugins {
    id 'com.android.application' version '8.13.0'
    id 'com.android.library' version '8.13.0' apply false
    id 'com.google.protobuf' version '0.9.5' apply false
}

ext {
    versions = [
        dagger  : '2.23',
        protobuf: '3.25.5',
    ]
    // Library versions shared by every module.
    androidx = [
        'androidx.annotation:annotation:1.9.1',
        'androidx.appcompat:appcompat:1.7.0',
        'androidx.constraintlayout:constraintlayout:2.1.4',
        'androidx.legacy:legacy-support-core-ui:1.0.0',
        'androidx.leanback:leanback:1.2.0-alpha04',
        'androidx.leanback:leanback-preference:1.2.0-alpha04',
        'androidx.palette:palette:1.0.0',
        'androidx.preference:preference:1.2.1',
        'androidx.recyclerview:recyclerview:1.3.2',
        'androidx.tvprovider:tvprovider:1.0.0',
    ]
}

android {
    namespace 'com.android.tv'
    compileSdk 36

    defaultConfig {
        applicationId 'com.livetv.tv'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }

    // LiveTV: BuildConfig.APPLICATION_ID names the search provider (debug and release differ).
    buildFeatures {
        buildConfig true
    }

    // LiveTV: the release key is read from keystore.properties (not in git): storeFile,
    // storePassword, keyAlias and keyPassword. Without it, the release is signed with the debug
    // key, which must never be published.
    def keystorePropertiesFile = rootProject.file('keystore.properties')
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // LiveTV: installs next to the release, as "LiveTV Debug" (res-debug).
            applicationIdSuffix '.debug'
            minifyEnabled false
        }
        release {
            // TODO(b/122608868) AOSP also ships with proguard off.
            minifyEnabled false
            signingConfig keystorePropertiesFile.exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest_common.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res', 'material_res', 'ratings/res']
            assets.srcDirs = ['assets']
        }
        // Equivalent of Soong's additional_manifests for the LiveTv target.
        debug.manifest.srcFile 'AndroidManifest_all_inputs.xml'
        debug.res.srcDirs = ['res-debug']
        release.manifest.srcFile 'AndroidManifest_all_inputs.xml'
    }
}

dependencies {
    implementation project(':common')
    implementation project(':partner_support')
    compileOnly project(':systemstubs')

    rootProject.ext.androidx.each { implementation it }
    // Player of the LiveTV IPTV input. DefaultMediaSourceFactory loads the HLS/DASH modules by
    // reflection and throws if a stream needs one that is missing.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    // MPEG audio layer I/II (MP2) decoder in Java (LGPL), for the TVs without one: most TS
    // channels carry MP2 audio, and without a decoder ExoPlayer plays them muted.
    implementation 'javazoom:jlayer:1.0.1'
    implementation "com.google.dagger:dagger:${versions.dagger}"
    implementation "com.google.dagger:dagger-android:${versions.dagger}"
    implementation 'com.google.guava:guava:28.0-android'
    implementation "com.google.protobuf:protobuf-javalite:${versions.protobuf}"

    compileOnly 'com.google.auto.value:auto-value:1.5.3'
    compileOnly 'com.google.auto.factory:auto-factory:1.0-beta6'
    compileOnly 'com.google.errorprone:error_prone_annotations:2.3.2'
    compileOnly 'javax.annotation:javax.annotation-api:1.2'
    // Some sources still use the pre-AndroidX annotations.
    implementation 'com.android.support:support-annotations:28.0.0'

    annotationProcessor 'com.google.auto.value:auto-value:1.5.3'
    annotationProcessor 'com.google.auto.factory:auto-factory:1.0-beta6'
    annotationProcessor "com.google.dagger:dagger-compiler:${versions.dagger}"
    annotationProcessor "com.google.dagger:dagger-android-processor:${versions.dagger}"
}

// Every packaged APK is also copied to "Releases", next to the project folder: the ones published
// on GitHub to "APK-Releases", the debug ones to "APK-Debug-Releases".
tasks.withType(com.android.build.gradle.tasks.PackageApplication).configureEach { task ->
    def apkReleasesDir = file(
            "${rootDir}/../Releases/" + (task.name == 'packageRelease' ? 'APK-Releases' : 'APK-Debug-Releases'))
    task.doLast {
        copy {
            from(task.outputDirectory) {
                include '*.apk'
            }
            into apkReleasesDir
            // Named after the version: LiveTV-1.0.0.apk, LiveTV-debug-1.0.0.apk.
            def version = android.defaultConfig.versionName
            rename {
                task.name == 'packageRelease'
                        ? "LiveTV-${version}.apk"
                        : "LiveTV-debug-${version}.apk"
            }
        }
    }
}
